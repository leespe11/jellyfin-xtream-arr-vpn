[Application]
FileLogger\Age=1
FileLogger\AgeType=1
FileLogger\Backup=true
FileLogger\DeleteOld=true
FileLogger\Enabled=true
FileLogger\MaxSizeBytes=66560
FileLogger\Path=logs

[AutoRun]
OnTorrentAdded\Enabled=true
OnTorrentAdded\Program=sh /scripts/qbit-https-trackers.sh \"%K\"
enabled=false
program=

[BitTorrent]
MergeTrackersEnabled=true
Session\DHTEnabled=false
Session\DefaultSavePath={{TORRENTS_PATH}}
Session\ExcludedFileNames=
Session\GlobalMaxRatio=-1
Session\GlobalMaxSeedingMinutes=-1
Session\IgnoreSlowTorrentsForQueueing=true
Session\Interface=tun0
Session\InterfaceName=tun0
Session\LSDEnabled=false
Session\MaxActiveTorrents=20
Session\MaxActiveUploads=20
Session\PeXEnabled=false
Session\QueueingSystemEnabled=true
Session\ReannounceWhenAddressChanged=true
Session\StartPaused=false
Session\TempPath={{TORRENTS_PATH}}/incomplete
Session\TempPathEnabled=true
Session\UseAlternativeGlobalSpeedLimit=false

[Core]
AutoDeleteAddedTorrentFile=Never

[LegalNotice]
Accepted=true

[Meta]
MigrationVersion=12

[Network]
Cookies=@Invalid()
PortForwardingEnabled=false
Proxy\HostnameLookupEnabled=false
Proxy\Profiles\BitTorrent=true
Proxy\Profiles\Misc=true
Proxy\Profiles\RSS=true

[Preferences]
Connection\ResolvePeerCountries=true
General\Locale=en

[RSS]
AutoDownloader\DownloadRepacks=true
AutoDownloader\SmartEpisodeFilter=s(\\d+)e(\\d+), (\\d+)x(\\d+), "(\\d{4}[.\\-]\\d{1,2}[.\\-]\\d{1,2})", "(\\d{1,2}[.\\-]\\d{1,2}[.\\-]\\d{4})"

[WebUI]
APIKey={{QBIT_API_KEY}}
Address=*
Password_PBKDF2="{{QBIT_PASSWORD_PBKDF2}}"
Username={{QBIT_USERNAME}}
ServerDomains=*
