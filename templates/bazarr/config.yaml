# Seeded by scripts/bootstrap.sh before Bazarr first starts; Bazarr fills in every
# setting left out here with its default. Values in {{...}} come from .env.
---
auth:
  apikey: '{{BAZARR_API_KEY}}'
  password: '{{BAZARR_PASSWORD_MD5}}'
  type: form
  username: '{{ADMIN_USER}}'
backup:
  day: 6
  folder: /config/backup
  frequency: Weekly
  hour: 3
  retention: 31
general:
  adaptive_searching: true
  adaptive_searching_delay: 3w
  adaptive_searching_delta: 1w
  anti_captcha_provider: null
  auto_update: true
  base_url: ''
  branch: master
  chmod: '0640'
  chmod_enabled: false
  concurrent_jobs: 4
  days_to_upgrade_subs: 7
  debug: false
  default_und_audio_lang: ''
  default_und_embedded_subtitles_lang: ''
  disable_all_providers_ssl_verify: false
  dont_notify_manual_actions: false
  embedded_subs_show_desired: true
  embedded_subtitles_parser: ffprobe
  enable_strm_support: false
  enabled_integrations: []
  enabled_providers:
  - subf2m
  - yifysubtitles
  - opensubtitlescom
  hi_extension: cc
  ignore_ass_subs: false
  ignore_pgs_subs: false
  ignore_vobsub_subs: false
  instance_name: Bazarr
  ip: '*'
  language_equals: []
  minimum_score: 90
  minimum_score_movie: 70
  movie_default_enabled: true
  movie_default_profile: 1
  movie_tag_enabled: false
  multithreading: true
  notify_if_nothing_is_missing_for_signalr_event: false
  page_size: 25
  parse_embedded_audio_track: false
  path_mappings: []
  path_mappings_movie: []
  port: 6767
  postprocessing_cmd: ''
  postprocessing_threshold: 90
  postprocessing_threshold_movie: 70
  remove_profile_tags: []
  serie_default_enabled: true
  serie_default_profile: 1
  serie_tag_enabled: false
  show_live_badge: true
  single_language: true
  skip_hashing: false
  subfolder: current
  subfolder_custom: ''
  subzero_mods: ''
  theme: auto
  upgrade_frequency: 12
  upgrade_manual: true
  upgrade_subs: true
  use_embedded_subs: true
  use_jellyfin: true
  use_plex: false
  use_postprocessing: false
  use_postprocessing_threshold: false
  use_postprocessing_threshold_movie: false
  use_radarr: true
  use_scenename: true
  use_sonarr: true
  use_whisper_fallback: false
  use_whisper_fallback_series: false
  utf8_encode: true
  wanted_search_frequency: 6
  wanted_search_frequency_movie: 6
jellyfin:
  apikey: '{{JELLYFIN_KEY_BAZARR}}'
  movie_library:
  - Movies
  - Movies Local
  movie_library_ids:
  - '{{JF_ID_MOVIES}}'
  - '{{JF_ID_MOVIES_LOCAL}}'
  refresh_method: async
  series_library:
  - Shows Local
  series_library_ids:
  - '{{JF_ID_SHOWS_LOCAL}}'
  update_movie_library: true
  update_series_library: true
  url: http://gluetun:8096
opensubtitlescom:
  include_ai_translated: false
  include_machine_translated: false
  password: '{{OPENSUBTITLES_PASSWORD:-}}'
  use_hash: true
  username: '{{OPENSUBTITLES_USERNAME:-}}'
radarr:
  apikey: '{{RADARR_API_KEY}}'
  base_url: ''
  defer_search_signalr: false
  excluded_tags: []
  full_update: Daily
  full_update_day: 6
  full_update_hour: 4
  http_timeout: 60
  ip: radarr
  movies_sync: 60
  movies_sync_on_live: true
  only_monitored: false
  port: 7878
  ssl: false
  sync_only_monitored_movies: false
  use_ffprobe_cache: true
sonarr:
  apikey: '{{SONARR_API_KEY}}'
  base_url: ''
  defer_search_signalr: false
  exclude_season_zero: false
  excluded_series_types: []
  excluded_tags: []
  full_update: Daily
  full_update_day: 6
  full_update_hour: 4
  http_timeout: 60
  ip: sonarr
  only_monitored: false
  port: 8989
  series_sync: 60
  series_sync_on_live: true
  ssl: false
  sync_only_monitored_episodes: false
  sync_only_monitored_series: false
  use_ffprobe_cache: true
